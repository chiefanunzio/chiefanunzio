<svg width="820" height="460" viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Consolas',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111a13"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .line { opacity: 0; animation: rise 0.5s ease-out forwards; }
      .l1 { animation-delay: 0.2s; }
      .l2 { animation-delay: 0.9s; }
      .l3 { animation-delay: 1.6s; }
      .l4 { animation-delay: 2.3s; }
      .l5 { animation-delay: 3.0s; }
      .l6 { animation-delay: 3.7s; }
      .l7 { animation-delay: 4.4s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      .dot { animation: pulse 2s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse {
        0%   { opacity: 0.4; transform: scale(0.85); }
        50%  { opacity: 1;   transform: scale(1.15); }
        100% { opacity: 0.4; transform: scale(0.85); }
      }
      .frame { animation: frameglow 3s ease-in-out infinite; }
      @keyframes frameglow {
        0%,100% { stroke-opacity: 0.35; }
        50%     { stroke-opacity: 0.9; }
      }
      .prompt { fill: #2ea043; }
      .txt { fill: #c9d1d9; }
      .accent { fill: #58a6ff; }
      .dim { fill: #6e7681; }
    </style>
  </defs>

  <rect x="4" y="4" width="812" height="452" rx="14" fill="url(#bg)" stroke="#2ea043" stroke-width="1.5" class="frame"/>

  <!-- title bar -->
  <circle cx="30" cy="30" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="30" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="30" r="6" fill="#27c93f"/>
  <text x="410" y="35" text-anchor="middle" font-size="13" class="dim">nunzio@self-hosted: ~</text>

  <circle cx="770" cy="30" r="5" fill="#2ea043" class="dot" filter="url(#glow)"/>
  <text x="700" y="35" font-size="12" class="dim" text-anchor="end">online</text>

  <!-- terminal body -->
  <g font-size="17">
    <g class="line l1"><text x="34" y="90"><tspan class="prompt">➜</tspan> <tspan class="accent">~</tspan> <tspan class="txt">whoami</tspan></text></g>
    <g class="line l2"><text x="34" y="122" class="txt">nunzio — full-stack dev · self-hosting evangelist</text></g>

    <g class="line l3"><text x="34" y="164"><tspan class="prompt">➜</tspan> <tspan class="accent">~</tspan> <tspan class="txt">cat stack.txt</tspan></text></g>
    <g class="line l4"><text x="34" y="196" class="txt">Angular · Signals · RxJS · Kendo UI · Nx</text></g>
    <g class="line l4"><text x="34" y="222" class="txt">Docker · Kubernetes · zero vendor lock-in</text></g>

    <g class="line l5"><text x="34" y="264"><tspan class="prompt">➜</tspan> <tspan class="accent">~</tspan> <tspan class="txt">echo $PRINCIPLES</tspan></text></g>
    <g class="line l6"><text x="34" y="296" class="txt">"codice pulito &gt; codice furbo"</text></g>

    <g class="line l7">
      <text x="34" y="344"><tspan class="prompt">➜</tspan> <tspan class="accent">~</tspan> <tspan class="txt">▊</tspan></text>
      <rect x="70" y="330" width="11" height="16" class="prompt cursor"/>
    </g>
  </g>

  <line x1="34" y1="390" x2="786" y2="390" stroke="#21262d" stroke-width="1"/>
  <text x="34" y="420" font-size="13" class="dim">offline mode: falegnameria — stesso rigore, ritmo più lento</text>
  <text x="786" y="420" font-size="13" class="dim" text-anchor="end">uptime: sempre in imparo</text>
</svg>
